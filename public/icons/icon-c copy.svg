<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 透明背景，仅保留外框和线稿元素 -->
  <rect x="16" y="16" width="96" height="96" rx="24" fill="none" stroke="#0F172A" stroke-width="2"/>

  <!-- 标签页轮廓 -->
  <path
    d="M40 54C40 49.6 43.6 46 48 46H64L68 54H80C84.4 54 88 57.6 88 62V82C88 86.4 84.4 90 80 90H48C43.6 90 40 86.4 40 82V54Z"
    fill="none"
    stroke="#0F172A"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- 豆芽：细茎 + 两片线稿小叶子，更具“萌芽”意象 -->
  <!-- 茎 -->
  <path
    d="M64 80V66"
    stroke="#16A34A"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- 左叶（线稿） -->
  <path
    d="M64 68C60.5 66.5 58.5 64 58.5 61C60.7 61.1 62.8 61.9 64.2 63.4Z"
    fill="none"
    stroke="#16A34A"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- 右叶（线稿） -->
  <path
    d="M64 68C67.5 66.5 69.5 64 69.5 61C67.3 61.1 65.2 61.9 63.8 63.4Z"
    fill="none"
    stroke="#16A34A"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- 地线 -->
  <path
    d="M52 80C56 82 60 83 64 83C68 83 72 82 76 80"
    stroke="#0F172A"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
