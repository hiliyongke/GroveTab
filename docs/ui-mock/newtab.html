<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canopy Newtab — antd v6 视觉稿</title>
  <!-- 使用 React 18 + antd v5.22 做视觉稿预览（antd v6 只发 ESM，无 UMD；v5.22 视觉与 v6 100% 一致，仅作预览用） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.22.5/dist/reset.css" />
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd@5.22.5/dist/antd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ant-design/icons@5.5.2/dist/index.umd.min.js"></script>
  <style>
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .mock-shell { min-height: 100%; transition: background 0.3s; }
    .tab-row { transition: background 0.12s; }
    .tab-row:hover { background: var(--bg-hover); }
    .favicon {
      width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
      background: linear-gradient(135deg, #1677ff, #69b1ff);
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 9px; font-weight: 700;
    }
    .domain-card { break-inside: avoid; }
  </style>
</head>
<body>
<div id="root"></div>

<script>
  /* ═══════════════════════════════════════════════════════════════════
   * 视觉稿：纯 React.createElement + antd v5.22（免 babel，秒开）
   * ═══════════════════════════════════════════════════════════════════ */
  (function bootstrap() {
    // ─── 依赖自检 ───────────────────────────────────
    const missing = [];
    if (typeof React === 'undefined') missing.push('React');
    if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
    if (typeof antd === 'undefined') missing.push('antd');
    if (typeof icons === 'undefined') missing.push('@ant-design/icons');
    if (missing.length) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:system-ui">' +
        '<h2 style="color:#cf1322">❌ 依赖加载失败</h2>' +
        '<p>以下 CDN 脚本未加载：<code>' + missing.join(', ') + '</code></p>' +
        '<p>请检查网络能否访问 <code>cdn.jsdelivr.net</code>。</p>' +
        '</div>';
      return;
    }

  const { createElement: h, useState, useMemo, Fragment } = React;
  const {
    ConfigProvider, theme: antdTheme,
    Layout, Button, Input, Card, Tag, Space, Typography, Segmented,
    Dropdown, Tooltip, Divider, Badge: AntBadge, Avatar,
    List, Alert, Steps, Empty, Switch, Tabs, Progress,
    Drawer, Modal, Form, Select, message, Row, Col, Statistic, Breadcrumb,
    theme: _theme
  } = antd;
  const {
    SearchOutlined, SettingOutlined, InboxOutlined, BulbOutlined, BulbFilled,
    AppstoreOutlined, ClockCircleOutlined, UnorderedListOutlined,
    TableOutlined, FireOutlined, CloseOutlined, PushpinOutlined,
    CheckCircleOutlined, ExclamationCircleOutlined, BgColorsOutlined,
    ExportOutlined, TagsOutlined, PlusOutlined, EllipsisOutlined,
    GlobalOutlined, FileTextOutlined, FolderOpenOutlined, DeleteOutlined,
    CopyOutlined, ShareAltOutlined, QuestionCircleOutlined, ArrowRightOutlined
  } = icons;
  const { Header, Content } = Layout;
  const { Title, Text, Paragraph } = Typography;

  // ─── 设计令牌 ──────────────────────────────────────
  const sharedToken = {
    colorPrimary: '#1677ff',
    borderRadius: 10,
    borderRadiusLG: 14,
    borderRadiusSM: 6,
    controlHeight: 36,
    controlHeightLG: 44,
    fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif',
    fontSize: 14,
  };

  // ─── mock 数据 ────────────────────────────────────
  const mockDomains = [
    {
      domain: 'github.com',
      name: 'GitHub',
      color: '#24292e',
      count: 8,
      tabs: [
        { title: 'ant-design/ant-design: An enterprise-class UI design language', path: '/ant-design/ant-design', pinned: true, tags: ['工作', 'UI库'] },
        { title: 'react-component/virtual-list · Virtual list component for React', path: '/react-component/virtual-list', tags: ['工作'] },
        { title: 'vitejs/vite: Next generation frontend tooling', path: '/vitejs/vite' },
        { title: 'TanStack/query — Powerful asynchronous state management', path: '/TanStack/query', tags: ['工作'] },
        { title: 'shadcn-ui/ui: Beautifully designed components', path: '/shadcn-ui/ui' },
        { title: 'facebook/react — The library for web and native UIs', path: '/facebook/react', duplicate: true },
        { title: 'microsoft/TypeScript: A superset of JavaScript', path: '/microsoft/TypeScript' },
        { title: 'vercel/next.js — The React Framework', path: '/vercel/next.js' },
      ],
    },
    {
      domain: 'ant.design',
      name: 'Ant Design',
      color: '#1677ff',
      count: 3,
      tabs: [
        { title: 'Ant Design of React - Ant Design', path: '/docs/react/introduce', pinned: true, tags: ['文档'] },
        { title: 'Components Overview - Ant Design', path: '/components/overview' },
        { title: 'Design Values - Ant Design', path: '/docs/spec/values' },
      ],
    },
    {
      domain: 'notion.so',
      name: 'Notion',
      color: '#000000',
      count: 5,
      tabs: [
        { title: 'Q2 产品路线图 2026', path: '/workspace/q2-roadmap', tags: ['个人'] },
        { title: '读书笔记 · 设计的精髓', path: '/notes/design-essentials' },
        { title: '每周回顾 Week 17', path: '/weekly/w17' },
        { title: 'Canopy 需求清单', path: '/projects/canopy', tags: ['工作'] },
        { title: 'Canopy 需求清单', path: '/projects/canopy', duplicate: true },
      ],
    },
    {
      domain: 'youtube.com',
      name: 'YouTube',
      color: '#ff0000',
      count: 4,
      tabs: [
        { title: 'Build a Chrome Extension with React + Vite in 2026', path: '/watch?v=abc123' },
        { title: 'Ant Design 6.0 深度解读', path: '/watch?v=def456', tags: ['学习'] },
        { title: 'Linear Design System Teardown', path: '/watch?v=ghi789' },
        { title: 'Arc Browser — The End of Tabs?', path: '/watch?v=jkl012', tags: ['灵感'] },
      ],
    },
  ];

  // ─── 视图：域名分组 ───────────────────────────────
  function DomainGroupView({ darkMode }) {
    return h('div', { style: {
      columnCount: 2, columnGap: 16, columnFill: 'balance'
    }},
      mockDomains.map(grp => h(DomainCard, { key: grp.domain, group: grp, darkMode }))
    );
  }

  function DomainCard({ group, darkMode }) {
    const [expanded, setExpanded] = useState(true);
    const bgHover = darkMode ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.025)';
    return h('div', { className: 'domain-card', style: { marginBottom: 16 }},
      h(Card, {
        size: 'small',
        variant: 'outlined',
        styles: { body: { padding: 0 } },
        title: h(Space, { size: 10 },
          h('div', {
            style: {
              width: 24, height: 24, borderRadius: 6,
              background: group.color, color: '#fff',
              display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 11, fontWeight: 700
            }
          }, group.name[0]),
          h(Text, { strong: true, style: { fontSize: 13 }}, group.name),
          h(Tag, { color: 'default', style: { marginInlineEnd: 0 }}, group.count)
        ),
        extra: h(Space, { size: 2 },
          h(Tooltip, { title: '归档整组' },
            h(Button, { type: 'text', size: 'small', icon: h(InboxOutlined) })
          ),
          h(Tooltip, { title: '关闭整组' },
            h(Button, { type: 'text', size: 'small', icon: h(CloseOutlined), danger: true })
          )
        ),
      },
        h('div', null,
          group.tabs.slice(0, expanded ? group.tabs.length : 3).map((tab, idx) =>
            h(TabRow, { key: idx, tab, bgHover, darkMode })
          ),
          group.tabs.length > 3 && h('div', {
            style: { padding: '6px 12px', borderTop: `1px solid var(--ant-color-border-secondary)` }
          },
            h(Button, {
              type: 'link', size: 'small', block: true,
              onClick: () => setExpanded(!expanded)
            }, expanded ? '收起' : `展开全部 ${group.tabs.length} 项`)
          )
        )
      )
    );
  }

  function TabRow({ tab, bgHover, darkMode }) {
    const [hover, setHover] = useState(false);
    return h('div', {
      className: 'tab-row',
      onMouseEnter: () => setHover(true),
      onMouseLeave: () => setHover(false),
      style: {
        display: 'flex', alignItems: 'center', gap: 8,
        padding: '6px 12px',
        borderTop: '1px solid var(--ant-color-border-secondary)',
        background: hover ? bgHover : 'transparent',
        cursor: 'pointer',
        '--bg-hover': bgHover,
      }
    },
      h('span', { className: 'favicon' }, tab.title[0].toUpperCase()),
      tab.pinned && h(PushpinOutlined, { style: { color: '#faad14', fontSize: 11 }}),
      h('div', { style: { flex: 1, minWidth: 0 }},
        h('div', {
          style: {
            fontSize: 13, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
            color: 'var(--ant-color-text)'
          }
        }, tab.title),
      ),
      tab.tags && tab.tags.map(t =>
        h(Tag, { key: t, color: 'blue', style: { marginInlineEnd: 0, fontSize: 10, lineHeight: '16px', padding: '0 5px' }}, t)
      ),
      tab.duplicate && h(Tooltip, { title: '重复标签页' },
        h(Tag, { color: 'warning', icon: h(CopyOutlined), style: { marginInlineEnd: 0, fontSize: 10 }}, '重复')
      ),
      hover && h(Button, { type: 'text', size: 'small', icon: h(CloseOutlined), danger: true })
    );
  }

  // ─── 去重信息栏 ───────────────────────────────────
  function DedupBar() {
    return h(Alert, {
      type: 'warning',
      showIcon: true,
      icon: h(CopyOutlined),
      style: { marginBottom: 16, borderRadius: 10 },
      message: h(Space, { size: 'small' },
        h(Text, { strong: true }, '发现 2 组重复标签'),
        h(Text, { type: 'secondary', style: { fontSize: 12 }}, '共 2 个可合并'),
      ),
      action: h(Space, null,
        h(Button, { size: 'small' }, '稍后处理'),
        h(Button, { size: 'small', type: 'primary' }, '一键合并')
      ),
      closable: true,
    });
  }

  // ─── 引导卡 ───────────────────────────────────────
  function OnboardingCard({ onClose }) {
    return h(Card, {
      variant: 'outlined',
      style: { marginBottom: 16, borderRadius: 14 },
      styles: { body: { padding: 20 } }
    },
      h(Space, { align: 'start', size: 16, style: { width: '100%' }},
        h('div', {
          style: {
            width: 44, height: 44, borderRadius: 12,
            background: 'linear-gradient(135deg, #1677ff, #69b1ff)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            flexShrink: 0, color: '#fff', fontSize: 22
          }
        }, h(BulbFilled)),
        h('div', { style: { flex: 1 }},
          h(Title, { level: 5, style: { margin: 0, marginBottom: 4 }}, '欢迎使用 Canopy'),
          h(Text, { type: 'secondary', style: { fontSize: 13 }},
            '把打开的每个标签页都变得井井有条。按 '),
          h(Tag, { bordered: true, style: { margin: '0 4px', fontFamily: 'monospace' }}, '⌘K'),
          h(Text, { type: 'secondary', style: { fontSize: 13 }}, ' 开始快速搜索。'),
          h('div', { style: { marginTop: 12 }},
            h(Space, null,
              h(Button, { type: 'primary', icon: h(ArrowRightOutlined) }, '开始体验'),
              h(Button, { type: 'text' }, '跳过引导')
            )
          )
        ),
        h(Button, { type: 'text', icon: h(CloseOutlined), onClick: onClose })
      )
    );
  }

  // ─── 顶栏 ─────────────────────────────────────────
  function TopHeader({ darkMode, setDarkMode, onSettings, onArchive }) {
    return h(Header, {
      style: {
        background: 'var(--ant-color-bg-container)',
        borderBottom: '1px solid var(--ant-color-border-secondary)',
        padding: '0 24px',
        display: 'flex', alignItems: 'center',
        height: 56, position: 'sticky', top: 0, zIndex: 10,
        backdropFilter: 'blur(8px)',
      }
    },
      h(Space, { size: 10, style: { flex: 1 }},
        h('div', {
          style: {
            width: 28, height: 28, borderRadius: 8,
            background: 'linear-gradient(135deg, #1677ff, #69b1ff)',
            color: '#fff', fontWeight: 800, fontSize: 15,
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center'
          }
        }, 'C'),
        h(Text, { strong: true, style: { fontSize: 15 }}, 'Canopy'),
        h(Tag, { bordered: true, style: { fontSize: 11, marginInlineStart: 6 }}, '20 标签 · 4 域名')
      ),
      h(Space, { size: 4 },
        h(Tooltip, { title: '归档会话' },
          h(Button, { type: 'text', icon: h(InboxOutlined), onClick: onArchive })
        ),
        h(Tooltip, { title: darkMode ? '切换浅色' : '切换深色' },
          h(Button, { type: 'text', icon: darkMode ? h(BulbFilled) : h(BulbOutlined),
            onClick: () => setDarkMode(!darkMode) })
        ),
        h(Tooltip, { title: '设置' },
          h(Button, { type: 'text', icon: h(SettingOutlined), onClick: onSettings })
        )
      )
    );
  }

  // ─── Hero 区（搜索 + 视图切换）────────────────────
  function Hero({ viewMode, setViewMode, onSearch }) {
    return h('section', { style: { padding: '28px 0 20px' }},
      h(Row, { gutter: 16, align: 'middle', wrap: false },
        h(Col, { flex: 'auto' },
          h(Input, {
            size: 'large',
            placeholder: '搜索任何标签、历史、书签 — ⌘K',
            prefix: h(SearchOutlined, { style: { color: 'var(--ant-color-text-tertiary)' }}),
            suffix: h(Tag, { bordered: true, style: { fontFamily: 'monospace', margin: 0 }}, '⌘K'),
            onFocus: onSearch,
            style: { borderRadius: 999 }
          })
        ),
        h(Col, { flex: 'none' },
          h(Segmented, {
            size: 'large',
            value: viewMode,
            onChange: setViewMode,
            options: [
              { value: 'domain', icon: h(AppstoreOutlined), label: '域名' },
              { value: 'timeline', icon: h(ClockCircleOutlined), label: '时间' },
              { value: 'compact', icon: h(UnorderedListOutlined), label: '紧凑' },
              { value: 'grid', icon: h(TableOutlined), label: '网格' },
              { value: 'frequency', icon: h(FireOutlined), label: '热度' },
            ]
          })
        )
      )
    );
  }

  // ─── 时间轴视图 ───────────────────────────────────
  function TimelineView() {
    const groups = [
      { label: '过去 1 小时', items: mockDomains[0].tabs.slice(0, 3) },
      { label: '今天早些', items: mockDomains[2].tabs.slice(0, 4) },
      { label: '昨天', items: mockDomains[3].tabs },
    ];
    return h('div', null,
      groups.map((g, i) => h(Card, {
        key: i, size: 'small', variant: 'outlined', title: g.label,
        style: { marginBottom: 12, borderRadius: 10 },
        styles: { body: { padding: 0 }}
      },
        g.items.map((tab, idx) => h(TabRow, { key: idx, tab, bgHover: 'rgba(22,119,255,0.04)' }))
      ))
    );
  }

  // ─── 紧凑列表 ─────────────────────────────────────
  function CompactView() {
    const all = mockDomains.flatMap(g => g.tabs);
    return h(Card, { variant: 'outlined', styles: { body: { padding: 0 }}, style: { borderRadius: 10 }},
      all.map((tab, i) => h(TabRow, { key: i, tab, bgHover: 'rgba(22,119,255,0.04)' }))
    );
  }

  // ─── 网格视图 ─────────────────────────────────────
  function GridView() {
    const all = mockDomains.flatMap(g => g.tabs.map(t => ({...t, domain: g.domain, color: g.color})));
    return h(Row, { gutter: [12, 12] },
      all.map((tab, i) => h(Col, { key: i, xs: 12, sm: 8, md: 6, lg: 6, xl: 4 },
        h(Card, {
          hoverable: true, variant: 'outlined', size: 'small',
          style: { borderRadius: 10, height: '100%' },
          styles: { body: { padding: 12 }}
        },
          h('div', { style: {
            width: '100%', height: 72, borderRadius: 6,
            background: `linear-gradient(135deg, ${tab.color}22, ${tab.color}66)`,
            marginBottom: 8, display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: tab.color, fontWeight: 700, fontSize: 24
          }}, tab.domain[0].toUpperCase()),
          h(Text, { ellipsis: true, style: { fontSize: 12, display: 'block' }}, tab.title),
          h(Text, { type: 'secondary', style: { fontSize: 11 }}, tab.domain)
        )
      ))
    );
  }

  // ─── 主应用 ───────────────────────────────────────
  function App() {
    const [darkMode, setDarkMode] = useState(false);
    const [viewMode, setViewMode] = useState('domain');
    const [showOnboarding, setShowOnboarding] = useState(true);
    const [settingsOpen, setSettingsOpen] = useState(false);
    const [archiveOpen, setArchiveOpen] = useState(false);
    const [searchOpen, setSearchOpen] = useState(false);

    const themeConfig = {
      algorithm: darkMode ? antdTheme.darkAlgorithm : antdTheme.defaultAlgorithm,
      token: sharedToken,
      components: {
        Card: { borderRadiusLG: 10, headerBg: 'transparent' },
        Layout: { headerBg: 'var(--ant-color-bg-container)' },
      }
    };

    const bgLayout = darkMode ? '#141414' : '#f5f7fa';

    return h(ConfigProvider, { theme: themeConfig },
      h('div', {
        className: 'mock-shell',
        style: { background: bgLayout, minHeight: '100vh' }
      },
        h(TopHeader, {
          darkMode, setDarkMode,
          onSettings: () => setSettingsOpen(true),
          onArchive: () => setArchiveOpen(true),
        }),
        h(Content, { style: { maxWidth: 1280, margin: '0 auto', padding: '0 24px 48px' }},
          h(Hero, {
            viewMode, setViewMode,
            onSearch: () => setSearchOpen(true),
          }),
          showOnboarding && h(OnboardingCard, { onClose: () => setShowOnboarding(false) }),
          h(DedupBar),
          h('section', null,
            viewMode === 'domain' && h(DomainGroupView, { darkMode }),
            viewMode === 'timeline' && h(TimelineView),
            viewMode === 'compact' && h(CompactView),
            viewMode === 'grid' && h(GridView),
            viewMode === 'frequency' && h(Empty, { description: '热度视图 — 待设计', style: { padding: 60 }}),
          )
        ),
        // ── Drawer: 设置 ──
        h(Drawer, {
          title: '设置', open: settingsOpen, onClose: () => setSettingsOpen(false),
          width: 420
        },
          h(Form, { layout: 'vertical' },
            h(Form.Item, { label: '默认视图' },
              h(Select, { defaultValue: 'domain', style: { width: '100%' }, options: [
                { value: 'domain', label: '域名分组' },
                { value: 'timeline', label: '时间轴' },
                { value: 'compact', label: '紧凑列表' },
              ]})
            ),
            h(Form.Item, { label: '主题外观' },
              h(Segmented, { block: true, options: ['浅色', '深色', '跟随系统'], defaultValue: '跟随系统' })
            ),
            h(Form.Item, { label: '自动去重' },
              h(Switch, { defaultChecked: true })
            ),
            h(Form.Item, { label: '显示引导' },
              h(Switch, { defaultChecked: false })
            ),
            h(Divider),
            h(Form.Item, { label: '关键字高亮' },
              h(Input.TextArea, { rows: 3, placeholder: '每行一个关键字', defaultValue: 'TODO\nFIXME\n紧急' })
            )
          )
        ),
        // ── Drawer: 归档 ──
        h(Drawer, {
          title: '归档会话', open: archiveOpen, onClose: () => setArchiveOpen(false),
          width: 480
        },
          h(List, {
            dataSource: [
              { name: 'Q2 产品规划研究', date: '昨天 14:23', count: 12 },
              { name: 'antd v6 迁移调研', date: '前天 09:15', count: 8 },
              { name: 'Chrome 扩展性能优化', date: '3 天前', count: 15 },
            ],
            renderItem: item => h(List.Item, {
              actions: [
                h(Button, { type: 'link', size: 'small' }, '恢复'),
                h(Button, { type: 'link', size: 'small', danger: true }, '删除')
              ]
            },
              h(List.Item.Meta, {
                avatar: h(Avatar, { shape: 'square', style: { background: '#1677ff' }, icon: h(FolderOpenOutlined) }),
                title: item.name,
                description: `${item.date} · ${item.count} 个标签`
              })
            )
          })
        ),
        // ── Modal: 搜索 ──
        h(Modal, {
          open: searchOpen, onCancel: () => setSearchOpen(false),
          footer: null, width: 640, closable: false,
          styles: { body: { padding: 0 }}
        },
          h('div', { style: { padding: '12px 16px', borderBottom: '1px solid var(--ant-color-border-secondary)' }},
            h(Input, {
              size: 'large', autoFocus: true, variant: 'borderless',
              placeholder: '搜索标签、历史、书签……',
              prefix: h(SearchOutlined, { style: { color: 'var(--ant-color-text-tertiary)' }}),
            })
          ),
          h('div', { style: { maxHeight: 420, overflow: 'auto', padding: 8 }},
            h(Text, { type: 'secondary', style: { padding: '6px 12px', display: 'block', fontSize: 11 }}, '快捷操作'),
            [
              { icon: h(PlusOutlined), text: '新建会话' },
              { icon: h(InboxOutlined), text: '归档所有标签' },
              { icon: h(BgColorsOutlined), text: '切换主题' },
            ].map((item, i) => h('div', {
              key: i,
              style: {
                padding: '8px 12px', borderRadius: 6, cursor: 'pointer',
                display: 'flex', alignItems: 'center', gap: 10,
              },
              onMouseEnter: e => e.currentTarget.style.background = 'var(--ant-color-fill-secondary)',
              onMouseLeave: e => e.currentTarget.style.background = 'transparent'
            }, item.icon, h(Text, null, item.text)))
          )
        )
      )
    );
  }
